set -g default-shell "/bin/bash"
set -g default-command "/bin/bash"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# match keeb
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
# Terminal tab title: "session | ", then one glyph per pane (windows space-separated):
#   Ø idle shell   ☷ running a command   ◐ agent working   ⁇ agent waiting on you   ✓ agent done
# Agent state is @agent, set by the Claude/pi hooks via scripts/attn; a pane back at a shell
# prompt always shows Ø, so a stale @agent after the agent exits doesn't matter; an agent
# with no state yet (no prompt since it started) is idle, Ø.
set -g set-titles-string "#S | #{W:#{P:#{?#{m/r:^(-|)(bash|zsh|fish|sh)$,#{pane_current_command}},Ø,#{?#{m/r:^(claude|pi)$,#{pane_current_command}},#{?#{==:#{@agent},busy},◐,#{?#{==:#{@agent},input},⁇,#{?#{==:#{@agent},done},✓,Ø}}},☷}}} }"

set-window-option -g monitor-activity on
set -g visual-activity off

# status line refreshes often enough to be a monitor
set -g status-interval 5

# Nudge client refresh on the events that change which process is in the foreground.
# (fixed [0] slots: -ga stacked a copy per reload)
set-hook -g pane-focus-in[0]     'refresh-client -S'
set-hook -g after-select-pane[0] 'refresh-client -S'

# Attention flags (scripts/attn): Claude/pi hooks and the shell's precmd set @attn on a pane;
# looking at the pane clears it (a bare `set -pu` in these hooks hits the newly active pane).
# Fixed [90] slots so a reload overwrites them instead of stacking duplicates.
set-hook -g pane-focus-in[90]          'set -pu @attn'
set-hook -g after-select-pane[90]      'set -pu @attn'
set-hook -g after-select-window[90]    'set -pu @attn'
set-hook -g client-session-changed[90] 'set -pu @attn'
# The "done" tint outlives the flag: arriving at the window keeps it as a "what just finished"
# cue. Interacting clears it: selecting the pane (M-arrows, prefix a), clicking it (MouseDown1Pane
# below; select-pane on the already-active pane fires no hook), scrolling into copy-mode
# (pane-mode-changed), typing (attn sweep from the status line), or running a command/prompt.
set-hook -g after-select-pane[91] 'if -F "#{@attn_done}" "set -pu @attn_done ; set -pu @attn_hash ; set -pu window-style ; set -pu window-active-style"'
bind a run -b "~/.config/tmux/scripts/attn jump '#{client_name}'"

set-option -g window-size latest
set-option -g history-limit 10000
set -sg escape-time 50

# only allow one client at a time, and snap the window to the new client's size
set-hook -g  client-attached 'run-shell -b "tmux list-clients -t \"#{session_name}\" -F \"##{client_tty}\" | grep -vx \"#{client_tty}\" | xargs -r -n1 tmux detach-client -t"'
set-hook -ga client-attached 'resize-window -A'
set-hook -ga client-attached 'set-window-option -u window-size'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @continuum-restore 'on'
set -g @continuum-restore-max-delay '60'       # sec; widen boot auto-restore window so a slow/NFS-stalled boot still qualifies (default 10)
set -g @continuum-save-interval '20'            # minutes
set -g @resurrect-capture-pane-contents 'on'    # save scrollback...
set -g @resurrect-pane-contents-area 'full'     # ...the entire buffer, not just visible
set -g @continuum-boot 'off'                    # restore on manual startup; no systemd boot service
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-never-overwrite 'on'           # don't replace active pane
set -g @resurrect-hook-post-save-layout 'bash ~/.config/tmux/scripts/resurrect-guard.sh save'
set -g @resurrect-hook-pre-restore-all 'bash ~/.config/tmux/scripts/resurrect-guard.sh restore ~/.local/share/tmux/resurrect'

set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @scroll-down-exit-copy-mode "off"

## Theme
set -g @plugin '2KAbhishek/tmux2k'
set -g @tmux2k-refresh-rate 15

set -g @tmux2k-left-plugins "session save uptime"
set -g @tmux2k-right-plugins "cpu ram disk"
set -g @tmux2k-cpu-usage-decimal "false"
set -g @tmux2k-window-list-left-sep ''
set -g @tmux2k-window-list-right-sep ''

set -g @tmux2k-theme 'onedark'
set -g @tmux2k-purple "#c678dd"
set -g @tmux2k-white "#eeeeee"
set -g @tmux2k-gray "#3a3a3a"
set -g @tmux2k-dark-yellow "#636363" # hack, dark_gray alr used

set -g @tmux2k-disk-colors "purple text"
set -g @tmux2k-save-colors "dark_yellow white"
set -g @tmux2k-session-colors "dark_red white"
set -g @tmux2k-uptime-colors "gray white"
set -g @tmux2k-prefix-highlight "#eeeeee"
set -g @tmux2k-message-bg 'default'
set -g @tmux2k-message-fg '#eeeeee'
set -g @tmux2k-bg-main 'default'  # transparent bar bg

# Binds
unbind C-b
set -g prefix C-s
bind C-s send-prefix

bind r source ~/.config/tmux/tmux.conf \; display -d 800 "Reloaded"

bind s setw synchronize-panes

bind - select-layout even-horizontal
bind = select-layout even-vertical

# Open new panes/windows in the current pane's working directory
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Mouse / copy
set-option -g mouse on
set-option -g mode-keys emacs
set -g extended-keys on
set -g extended-keys-format csi-u
unbind -T copy-mode Escape
bind -T copy-mode Escape send-keys -X clear-selection
unbind -T copy-mode C-s
unbind -T copy-mode C-r

# Ctrl+Shift+Up/Down: scroll 5 lines at a time (no selection change)
bind -T copy-mode C-S-Up   send-keys -N5 -X scroll-up
bind -T copy-mode C-S-Down send-keys -N5 -X scroll-down

# PageUp/PageDown: jump the scrollback between shell prompts (OSC 133;A marks;
# under ble.sh these are baked into oh-my-posh's transient prompt template in
# .bashrc, so the persistent `❯ cmd` scrollback lines keep them).
bind -T root     PPage if -F '#{alternate_on}' 'send-keys PPage' 'copy-mode ; send-keys -X previous-prompt'
bind -T copy-mode PPage send-keys -X previous-prompt
bind -T copy-mode NPage send-keys -X next-prompt

# Shift+Up/Down extend the selection (starts one if none is active)
bind -T copy-mode S-Up   if -F '#{selection_present}' 'send-keys -X cursor-up'   'send-keys -X begin-selection ; send-keys -X cursor-up'
bind -T copy-mode S-Down if -F '#{selection_present}' 'send-keys -X cursor-down' 'send-keys -X begin-selection ; send-keys -X cursor-down'
bind -T copy-mode S-Left  if -F '#{selection_present}' 'send-keys -X start-of-line' 'send-keys -X begin-selection ; send-keys -X start-of-line'
bind -T copy-mode S-Right if -F '#{selection_present}' 'send-keys -X cursor-down ; send-keys -X start-of-line' 'send-keys -X begin-selection ; send-keys -X cursor-down ; send-keys -X start-of-line'

# Search: prefix / enters copy-mode and prompts a backward (scrollback) search;
# in copy-mode / and ? prompt forward/backward, n/N repeat (emacs defaults)
bind / copy-mode \; command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" }
bind -T copy-mode / command-prompt -T search -p "(search down)" { send-keys -X search-forward "%%" }
bind -T copy-mode ? command-prompt -T search -p "(search up)"   { send-keys -X search-backward "%%" }

# tint pane background in copy-mode; entering/leaving it also counts as interacting, so it
# drops the attention tint (scripts/attn). set -p rather than select-pane -P, which also selects.
set -g @attn_tint '#1e3236'
set-hook -g pane-mode-changed 'set -pu @attn_done ; set -pu @attn_hash ; set -pF window-style "#{?pane_mode,bg=#1a1a2e,default}" ; set -pF window-active-style "#{?pane_mode,bg=#1a1a2e,default}"'

# pane info
set -g pane-border-status off
set -g pane-border-format ' #{pane_index} #{b:pane_current_path} #{?@last_cmd,$ #{@last_cmd},[#{pane_current_command}]} '
bind i if -F '#{==:#{pane-border-status},off}' 'set -g pane-border-status top' 'set -g pane-border-status off'
bind g display-message '#{pane_current_path}'

# notif
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# OSC 52 clipboard - selection does NOT auto-copy; hit `y` to send to clipboard
set -g set-clipboard on
set -g allow-passthrough off    # causes gibberish w windows term..
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode MouseDragEnd1Border send-keys -X stop-selection
bind -T copy-mode y send-keys -X copy-pipe-no-clear ~/.config/tmux/scripts/tmux-osc52-copy

# Double-click selects word, doesn't exit
bind -T root DoubleClick1Pane select-pane -t = \; copy-mode \; send-keys -X select-word
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word

# Triple-click selects line, doesn't exit
bind -T root TripleClick1Pane "select-pane -t = ; copy-mode ; send-keys -X select-line"
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line

# alt+wheel: scroll 5 lines per tick
bind -T root M-WheelUpPane if -F '#{pane_in_mode}' 'send-keys -N5 -X scroll-up' 'copy-mode -e ; send-keys -N5 -X scroll-up'
bind -T copy-mode M-WheelUpPane   if -F '#{@dragging}' 'send-keys -N5 -X scroll-up'   'send-keys -X stop-selection ; send-keys -N5 -X scroll-up'
bind -T copy-mode M-WheelDownPane if -F '#{@dragging}' 'send-keys -N5 -X scroll-down' 'send-keys -X stop-selection ; send-keys -N5 -X scroll-down'

#
#
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tmux-continuum'
#^at tail, cuz replaces status-right
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'
run-shell '~/.config/tmux/scripts/patch-status.sh'

# click = interaction: drop the attention tint, then tmux's default click behaviour
bind -n MouseDown1Pane if -F -t = '#{@attn_done}' 'set -pu -t = @attn_done ; set -pu -t = @attn_hash ; set -pu -t = window-style ; set -pu -t = window-active-style' \; select-pane -t = \; send-keys -M

# sync-panes indicator; ⚑ = a pane in the window has @attn (see scripts/attn).
# window-status-format is tmux2k's own, re-set here only to add ⚑. Its caps sit on bg=default
# (tmux2k uses #2d3139) so their corners stay transparent, like the current-window tab.
set -g window-status-current-format "#{?synchronize-panes,#[fg=#c678fd bg=default]#[bg=#c678fd fg=default] 󰓦 #[fg=#c678fd bg=default],}#[fg=#61afef,bg=default]#[bg=#61afef]#{?#{P:#{@attn}},#[fg=#e5c07b]⚑ ,}#{?window_flags,#[fg=#98c379]#{window_flags},}#[fg=default] #I:#W #[fg=#61afef,bg=default]"
set -g window-status-format "#[fg=#3a3a3a,bg=default]#[bg=#3a3a3a]#{?#{P:#{@attn}},#[fg=#e5c07b]⚑ ,}#{?window_flags,#[fg=#e06c75]#{window_flags},}#[fg=#eeeeee] #I:#W #[fg=#3a3a3a,bg=default]"

# don't smear selection when scrolling, maintain
# except for when holding m1, in which case expand
bind -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection \; set -p @dragging 1
bind -T root MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -M ; set -p @dragging 1'
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection \; set -pu @dragging
bind -T copy-mode MouseDragEnd1Border send-keys -X stop-selection \; set -pu @dragging

bind -T copy-mode WheelUpPane if -F '#{@dragging}' 'send-keys -X scroll-up' 'send-keys -X stop-selection ; send-keys -X scroll-up'
bind -T copy-mode WheelDownPane if -F '#{@dragging}' 'send-keys -X scroll-down' 'send-keys -X stop-selection ; send-keys -X scroll-down'



# Prefix key bindings reference (prefix = C-s)
# ── Custom (this config) ──────────────────────────────────
#   r       reload config
#   s       toggle synchronize-panes
#   -       even-horizontal layout
#   =       even-vertical layout
#   i       toggle pane-border-status
#   g       display full pane path
#   /       copy-mode + search up (in copy-mode: / down, ? up, n/N repeat)
#   a       jump to the newest ⚑ (attention-flagged) pane, any session
# ── Plugins ───────────────────────────────────────────────
#   I       TPM: install plugins
#   U       TPM: update plugins
#   M-u     TPM: clean plugins
#   C-s     resurrect: save        (overrides send-prefix)
#   C-r     resurrect: restore
#   R       sensible: source config
#   C-n     sensible: next-window
#   C-p     sensible: previous-window
# ── Defaults ──────────────────────────────────────────────
#   c       new-window          n/p     next/prev window
#   l       last-window         L       last-client
#   d       detach              w       choose-tree
#   x       kill-pane           &       kill-window
#   z       zoom pane           q       display-panes
#   o       next pane           ;       last-pane
#   0-9     select window       t       clock
#   "       split horiz         %       split vert
#   [       copy-mode           ]       paste
#   :       command-prompt      ?       list-keys
#   ,       rename-window       $       rename-session
#   .       move-window         '       select by index
#   {/}     swap pane           Space   next-layout
#   !       break-pane          ~       show-messages
#   C-o     rotate-window       C-z     suspend
#   M-1..7  preset layouts      E       spread evenly
#   arrows  select/resize pane
# ── Copy-mode (mode-keys emacs) ───────────────────────────
#   R       toggele rectangle-column select mode
#   y       copy selection to clipboard
#   g       goto line (from buffer top)
#   M-<     top of history        M->     bottom of history
#   n/N     next/prev match       C-r/C-s search up/down
#   /       search down           ?       search up
#   S-Up/S-Down  extend selection     S-Left/S-Right  jump to start of line / next line
#   PgUp/PgDn    jump prev/next shell prompt (OSC 133 marks); PgUp also enters copy-mode
